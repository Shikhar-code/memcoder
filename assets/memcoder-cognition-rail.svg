<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">How MemCoder works</title>
  <desc id="desc">A task passes through utility-aware retrieval and host verification while Project Cortex maintains durable continuity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#15132f"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72a7ff"/><stop offset=".55" stop-color="#b89cff"/><stop offset="1" stop-color="#61e6bd"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif }
      @keyframes breathe { 0%,100%{opacity:.3} 50%{opacity:1} }
      .breathe { animation:breathe 2.8s ease-in-out infinite }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#9db5e4" stroke-opacity=".17"/>
  <text x="62" y="51" fill="#f2f5ff" font-size="23" font-weight="750">Useful in the moment. Continuous across the project.</text>
  <text x="62" y="76" fill="#7f92b9" font-size="12" letter-spacing=".8">THE HOST ACTS / MEMCODER CONTROLS COGNITIVE CONTEXT</text>

  <path d="M104 161H1096" stroke="#31415f" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 161H1096" stroke="url(#rail)" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 10"/>

  <g transform="translate(104 161)"><circle r="38" fill="#132440" stroke="#72a7ff" stroke-width="2"/><text y="5" text-anchor="middle" fill="#e6efff" font-size="12" font-weight="700">TASK</text><text y="60" text-anchor="middle" fill="#7488ae" font-size="10">host request</text></g>
  <g transform="translate(350 161)"><circle r="38" fill="#16223f" stroke="#8da4ff" stroke-width="2"/><text y="-2" text-anchor="middle" fill="#e7ebff" font-size="12" font-weight="700">UTILITY</text><text y="14" text-anchor="middle" fill="#9aa8d4" font-size="9">GATE</text><text y="60" text-anchor="middle" fill="#7488ae" font-size="10">speak or stay silent</text></g>
  <g transform="translate(600 161)"><circle r="38" fill="#211b44" stroke="#b89cff" stroke-width="2"/><text y="5" text-anchor="middle" fill="#f0eaff" font-size="12" font-weight="700">GUIDE</text><text y="60" text-anchor="middle" fill="#9183b5" font-size="10">risk / brief / plan</text></g>
  <g transform="translate(850 161)"><circle r="38" fill="#172541" stroke="#7fabff" stroke-width="2"/><path d="M-14 0L-4 10L15-12" fill="none" stroke="#89b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="60" text-anchor="middle" fill="#7488ae" font-size="10">host verification</text></g>
  <g transform="translate(1096 161)"><circle class="breathe" r="45" fill="none" stroke="#61e6bd" stroke-opacity=".4"/><circle r="38" fill="#123b38" stroke="#61e6bd" stroke-width="2"/><text y="5" text-anchor="middle" fill="#dbfff4" font-size="12" font-weight="700">LEARN</text><text y="60" text-anchor="middle" fill="#75a99b" font-size="10">only from proof</text></g>
  <circle r="5" fill="#72a7ff" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite" path="M104 161H1096"/></circle>

  <rect x="180" y="263" width="840" height="58" rx="18" fill="#141936" stroke="#9a86e8" stroke-opacity=".42"/>
  <text x="214" y="288" fill="#c8baff" font-size="11" font-weight="700" letter-spacing="1.1">PROJECT CORTEX</text>
  <text x="214" y="307" fill="#7f8cb1" font-size="11">durable state / rationale-bearing decisions / drift checks / resurrection / safe handoff</text>
  <path d="M600 199V263" stroke="#a890ee" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="986" y="294" text-anchor="end" fill="#65cdb1" font-size="10" font-weight="700">CONTINUITY WITHOUT RAW CHAT</text>
</svg>
