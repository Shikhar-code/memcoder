<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MemCoder — verified memory for coding agents</title>
  <desc id="desc">A restrained technical cover showing a verified task receipt beside the MemCoder wordmark.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="1200" height="360" fill="#0b0f14"/>
  <path d="M0 0H1200M0 359H1200" stroke="#26313d"/>
  <rect x="48" y="42" width="8" height="276" fill="#78a9ff"/>

  <text x="88" y="78" fill="#78a9ff" font-size="13" font-weight="700" letter-spacing="2.4">MEMORY THAT HAS TO PROVE ITSELF</text>
  <text x="84" y="174" fill="#f3f6f8" font-size="78" font-weight="760" letter-spacing="-3">MemCoder</text>
  <text x="88" y="221" fill="#c1cad4" font-size="25">Verified memory for coding agents.</text>
  <text x="88" y="263" fill="#7f8b98" font-size="16">Retrieve less. Verify more. Keep what survives.</text>
  <g class="mono" font-size="12" fill="#98a4b0">
    <text x="88" y="306">LOCAL CORE</text>
    <text x="202" y="306">/</text>
    <text x="224" y="306">PROVIDER-FREE</text>
    <text x="360" y="306">/</text>
    <text x="382" y="306">BETA 3.5</text>
  </g>

  <g transform="translate(744 44)">
    <rect width="408" height="272" rx="4" fill="#111820" stroke="#344250"/>
    <rect width="408" height="38" fill="#17212b"/>
    <circle cx="21" cy="19" r="4" fill="#78a9ff"/>
    <text class="mono" x="36" y="24" fill="#bdc7d1" font-size="11" letter-spacing="1.2">OUTCOME RECEIPT / TASK-0042</text>
    <g class="mono" font-size="12">
      <text x="24" y="78" fill="#788593">INTERVENTION</text>
      <text x="202" y="78" fill="#f3f6f8">BRIEF</text>
      <path d="M24 94H384" stroke="#293641"/>
      <text x="24" y="124" fill="#788593">EVIDENCE</text>
      <text x="202" y="124" fill="#70d6ae">PASSED</text>
      <path d="M24 140H384" stroke="#293641"/>
      <text x="24" y="170" fill="#788593">GUIDANCE USED</text>
      <text x="202" y="170" fill="#f3f6f8">YES</text>
      <path d="M24 186H384" stroke="#293641"/>
      <text x="24" y="216" fill="#788593">OUTCOME</text>
      <text x="202" y="216" fill="#70d6ae">CONFIRMED</text>
    </g>
    <rect x="24" y="238" width="360" height="4" fill="#27343f"/>
    <rect x="24" y="238" width="360" height="4" fill="#70d6ae"/>
  </g>
</svg>
