<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc">
  <title id="title">MemCoder Beta 3.0</title>
  <desc id="desc">A local cognition layer that retrieves verified experience, decides when it is useful, and preserves project continuity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset=".52" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1a1037"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ea8ff"/>
      <stop offset=".5" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#5ce2bd"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      @keyframes fade { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
      @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes drift { from { transform:translateX(-220px) } to { transform:translateX(1320px) } }
      .fade { opacity:0; animation:fade .7s ease-out forwards }
      .d1 { animation-delay:.12s } .d2 { animation-delay:.24s } .d3 { animation-delay:.36s }
      .breathe { animation:breathe 2.8s ease-in-out infinite }
      .drift { animation:drift 8s linear infinite }
    </style>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#9db5e4" stroke-opacity=".2"/>

  <g opacity=".17" fill="none">
    <path d="M-70 330C140 230 285 385 490 283C690 184 776 77 984 137C1096 170 1175 124 1275 54" stroke="#72a7ff" stroke-width="2"/>
    <path d="M-70 360C150 270 320 408 536 307C729 217 817 132 1021 182C1128 208 1200 178 1275 128" stroke="#b89cff" stroke-width="2"/>
  </g>
  <rect class="drift" x="-250" width="180" height="390" fill="url(#brand)" opacity=".025" transform="skewX(-18)"/>

  <g class="fade">
    <rect x="66" y="49" width="284" height="34" rx="17" fill="#142443" stroke="#72a7ff" stroke-opacity=".55"/>
    <circle class="breathe" cx="88" cy="66" r="5" fill="#61e6bd" filter="url(#glow)"/>
    <text x="103" y="71" fill="#dce8ff" font-size="12" font-weight="700" letter-spacing="1.35">BETA 3.0 / LOCAL / EVIDENCE-GATED</text>
  </g>
  <text class="fade d1" x="64" y="158" fill="#f6f8ff" font-size="70" font-weight="800" letter-spacing="-2.5">MemCoder</text>
  <text class="fade d2" x="68" y="204" fill="#d0dcf3" font-size="24" font-weight="600">Cognition that earns its memory.</text>
  <text class="fade d2" x="68" y="241" fill="#93a8ce" font-size="18">Verified context. Safe transfer. Dreaming with proof.</text>

  <g class="fade d3">
    <rect x="68" y="283" width="150" height="39" rx="12" fill="#12243f" stroke="#72a7ff" stroke-opacity=".55"/>
    <text x="143" y="307" text-anchor="middle" fill="#dce9ff" font-size="12" font-weight="700">RETRIEVE</text>
    <path d="M225 302H257" stroke="#536c9b" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="264" y="283" width="150" height="39" rx="12" fill="#211b43" stroke="#b89cff" stroke-opacity=".65"/>
    <text x="339" y="307" text-anchor="middle" fill="#eee8ff" font-size="12" font-weight="700">DECIDE</text>
    <path d="M421 302H453" stroke="#536c9b" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="460" y="283" width="150" height="39" rx="12" fill="#113b37" stroke="#61e6bd" stroke-opacity=".7"/>
    <text x="535" y="307" text-anchor="middle" fill="#d8fff2" font-size="12" font-weight="700">CONTINUE</text>
  </g>

  <g transform="translate(733 55)">
    <rect width="400" height="280" rx="25" fill="#0b1429" fill-opacity=".78" stroke="#8298c7" stroke-opacity=".24"/>
    <text x="28" y="39" fill="#8498bf" font-size="11" font-weight="700" letter-spacing="1.45">ONE COGNITIVE CONTROL PLANE</text>

    <g transform="translate(28 65)">
      <rect width="344" height="68" rx="17" fill="#142442" stroke="#72a7ff" stroke-opacity=".55"/>
      <circle cx="35" cy="34" r="15" fill="#1d3561" stroke="#72a7ff"/>
      <path d="M28 34L33 39L42 28" fill="none" stroke="#8bb7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="28" fill="#edf4ff" font-size="15" font-weight="700">UTILITY ENGINE</text>
      <text x="64" y="49" fill="#8299c2" font-size="11">useful guidance or deliberate silence</text>
    </g>

    <g transform="translate(28 145)">
      <rect width="344" height="68" rx="17" fill="#211b43" stroke="#b89cff" stroke-opacity=".6"/>
      <circle cx="35" cy="34" r="15" fill="#352661" stroke="#b89cff"/>
      <path d="M28 38V30M35 38V25M42 38V32" stroke="#d2c1ff" stroke-width="2" stroke-linecap="round"/>
      <text x="64" y="28" fill="#f1edff" font-size="15" font-weight="700">SAFE DREAMING</text>
      <text x="64" y="49" fill="#9d8fc1" font-size="11">candidates, sandbox proof, reversible promotion</text>
    </g>

    <path d="M200 133V145" stroke="url(#brand)" stroke-width="2" stroke-dasharray="3 4"/>
    <circle class="breathe" cx="200" cy="237" r="5" fill="#61e6bd" filter="url(#glow)"/>
    <text x="216" y="241" fill="#79a99d" font-size="10" font-weight="700" letter-spacing="1">QA-GATED LEARNING</text>
  </g>

  <text x="1134" y="367" text-anchor="end" fill="#7084ac" font-size="10" letter-spacing="1.35">EXPERIENCE / PRINCIPLE / SKILL / DECISION / PROJECT</text>
</svg>
