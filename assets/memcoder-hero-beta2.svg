<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">MemCoder — verified cognition for AI agents</title>
  <desc id="desc">An animated cognition orbit turning verified experience into reusable skills and plans.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#101a36"/>
      <stop offset="1" stop-color="#171039"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#72a7ff"/>
      <stop offset="0.5" stop-color="#b89cff"/>
      <stop offset="1" stop-color="#61e6bd"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.3" r="0.8">
      <stop stop-color="#273d73"/>
      <stop offset="1" stop-color="#111b37"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: .32; } 50% { opacity: 1; } }
      @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      .d1 { animation-delay: .12s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .sweep { animation: sweep 8s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#9db5e4" stroke-opacity=".2"/>

  <g opacity=".22">
    <path d="M-80 296C140 210 260 365 470 276C670 191 755 72 972 137C1092 173 1171 121 1280 48" fill="none" stroke="#72a7ff" stroke-width="2"/>
    <path d="M-80 326C139 244 307 380 514 292C711 209 803 119 1008 177C1112 207 1195 175 1280 124" fill="none" stroke="#b89cff" stroke-width="2"/>
    <path d="M-80 346C185 286 333 407 566 319C749 250 874 184 1053 219C1132 234 1210 218 1280 184" fill="none" stroke="#61e6bd" stroke-width="1.5"/>
  </g>

  <rect class="sweep" x="-320" y="0" width="220" height="360" fill="url(#brand)" opacity=".025" transform="skewX(-18)"/>

  <g class="rise">
    <rect x="66" y="50" width="269" height="34" rx="17" fill="#142443" stroke="#72a7ff" stroke-opacity=".55"/>
    <circle class="pulse" cx="87" cy="67" r="5" fill="#61e6bd" filter="url(#glow)"/>
    <text x="102" y="72" fill="#dce8ff" font-size="12" font-weight="700" letter-spacing="1.45">LOCAL / VERIFIED / PROVIDER-FREE</text>
  </g>

  <text class="rise d1" x="64" y="158" fill="#f5f7ff" font-size="68" font-weight="800" letter-spacing="-2.5">MemCoder</text>
  <text class="rise d2" x="68" y="202" fill="#c8d5ef" font-size="23" font-weight="500">Persistent cognition for AI agents.</text>
  <text class="rise d2" x="68" y="235" fill="#c8d5ef" font-size="23" font-weight="500">Memory that has to earn influence.</text>
  <text class="rise d3" x="69" y="279" fill="#8598be" font-size="15" letter-spacing=".2">RETRIEVE PRECISELY  /  VERIFY EVIDENCE  /  REUSE WHAT PROVED ITSELF</text>

  <g>
    <circle cx="900" cy="181" r="118" fill="none" stroke="#7189bd" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="4 11"/>
    <circle cx="900" cy="181" r="82" fill="url(#core)" stroke="url(#brand)" stroke-width="2.5"/>
    <circle class="pulse" cx="900" cy="181" r="66" fill="none" stroke="#72a7ff" stroke-opacity=".35"/>
    <text x="900" y="173" text-anchor="middle" fill="#f4f7ff" font-size="34" font-weight="800">M</text>
    <text x="900" y="201" text-anchor="middle" fill="#aabce0" font-size="11" font-weight="700" letter-spacing="1.8">COGNITION</text>

    <g>
      <rect x="833" y="31" width="134" height="42" rx="13" fill="#142442" stroke="#72a7ff" stroke-opacity=".7"/>
      <text x="900" y="57" text-anchor="middle" fill="#dce8ff" font-size="12" font-weight="700">RETRIEVE</text>
    </g>
    <g>
      <rect x="1034" y="160" width="112" height="42" rx="13" fill="#19203f" stroke="#b89cff" stroke-opacity=".75"/>
      <text x="1090" y="186" text-anchor="middle" fill="#eee8ff" font-size="12" font-weight="700">VERIFY</text>
    </g>
    <g>
      <rect x="840" y="290" width="120" height="42" rx="13" fill="#123b38" stroke="#61e6bd" stroke-opacity=".75"/>
      <text x="900" y="316" text-anchor="middle" fill="#d8fff2" font-size="12" font-weight="700">COMPOUND</text>
    </g>
    <g>
      <rect x="659" y="160" width="106" height="42" rx="13" fill="#18233e" stroke="#7ea9ff" stroke-opacity=".6"/>
      <text x="712" y="186" text-anchor="middle" fill="#deebff" font-size="12" font-weight="700">GUIDE</text>
    </g>

    <path d="M900 73V97M982 181H1034M900 265V290M818 181H765" stroke="url(#brand)" stroke-width="2" stroke-dasharray="5 7"/>
    <circle r="5" fill="#72a7ff" filter="url(#glow)"><animateMotion dur="4.8s" repeatCount="indefinite" path="M900 73V97C978 103 1016 133 1034 181H982C976 250 948 278 900 290V265C822 256 784 225 765 181H818C824 112 853 84 900 73"/></circle>
    <circle r="4" fill="#61e6bd" filter="url(#glow)"><animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="M900 73V97C978 103 1016 133 1034 181H982C976 250 948 278 900 290V265C822 256 784 225 765 181H818C824 112 853 84 900 73"/></circle>
  </g>

  <text x="1134" y="336" text-anchor="end" fill="#7084ac" font-size="11" letter-spacing="1.4">EXPERIENCE &gt; PRINCIPLE &gt; SKILL &gt; PLAN</text>
</svg>
