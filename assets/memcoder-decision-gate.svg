<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">MemCoder utility gate</title>
  <desc id="desc">Trusted memories pass through applicability, decision value, risk, provenance, and cost checks before guidance is returned.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
  </style>
  <rect width="1200" height="330" fill="#f3f0e8"/>
  <text x="48" y="52" fill="#15202b" font-size="23" font-weight="720">Similarity gets a candidate in. Utility decides whether it speaks.</text>
  <text class="mono" x="48" y="78" fill="#607080" font-size="11" letter-spacing="1.2">THE DECISION GATE</text>

  <g transform="translate(48 112)">
    <text class="mono" x="0" y="0" fill="#607080" font-size="11">TRUSTED CANDIDATES</text>
    <g transform="translate(0 20)" class="mono" font-size="11">
      <rect width="198" height="38" fill="#ffffff" stroke="#b9c1c8"/><text x="14" y="24" fill="#15202b">EXP-04  0.91</text>
      <rect y="48" width="198" height="38" fill="#ffffff" stroke="#b9c1c8"/><text x="14" y="72" fill="#15202b">SKILL-11  0.84</text>
      <rect y="96" width="198" height="38" fill="#ffffff" stroke="#b9c1c8"/><text x="14" y="120" fill="#15202b">RISK-23  0.73</text>
    </g>
  </g>

  <path d="M270 198H350" stroke="#415466" stroke-width="2"/>
  <path d="M342 192L350 198L342 204" fill="none" stroke="#415466" stroke-width="2"/>

  <g transform="translate(350 107)">
    <rect width="420" height="170" fill="#111820"/>
    <text class="mono" x="22" y="30" fill="#78a9ff" font-size="11" letter-spacing="1.2">UTILITY CHECK</text>
    <g font-size="13" fill="#d7dee5">
      <text x="22" y="64">Applicable to this environment?</text><text x="388" y="64" text-anchor="end" fill="#70d6ae">YES</text>
      <text x="22" y="91">Likely to change a decision?</text><text x="388" y="91" text-anchor="end" fill="#70d6ae">YES</text>
      <text x="22" y="118">Provenance and validity intact?</text><text x="388" y="118" text-anchor="end" fill="#70d6ae">YES</text>
      <text x="22" y="145">Worth the context cost?</text><text x="388" y="145" text-anchor="end" fill="#70d6ae">YES</text>
    </g>
  </g>

  <path d="M770 164H850" stroke="#415466" stroke-width="2"/>
  <path d="M842 158L850 164L842 170" fill="none" stroke="#415466" stroke-width="2"/>
  <path d="M770 232H850" stroke="#415466" stroke-width="2"/>
  <path d="M842 226L850 232L842 238" fill="none" stroke="#415466" stroke-width="2"/>

  <g transform="translate(850 108)">
    <rect width="302" height="84" fill="#e2ecff" stroke="#78a9ff"/>
    <text class="mono" x="18" y="26" fill="#345f9e" font-size="11">RETURN</text>
    <text x="18" y="56" fill="#15202b" font-size="19" font-weight="700">risk · brief · plan</text>
  </g>
  <g transform="translate(850 202)">
    <rect width="302" height="74" fill="#ffffff" stroke="#b9c1c8"/>
    <text class="mono" x="18" y="26" fill="#607080" font-size="11">OR ABSTAIN</text>
    <text x="18" y="52" fill="#15202b" font-size="17" font-weight="650">none — host continues</text>
  </g>
</svg>
