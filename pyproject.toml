[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memcoder"
version = "0.2.0b1"
description = "Provider-independent persistent cognition for AI agents."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Shikhar"}
]

license = "MIT"

keywords = [
    "ai",
    "llm",
    "memory",
    "agent",
    "rag",
    "semantic-search",
    "vector-database",
    "chromadb"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "chromadb",
    "sentence-transformers",
    "numpy",
    "fastapi",
    "fastmcp"
]

[project.scripts]
memcoder = "memcoder.cli:main"

[project.optional-dependencies]
ollama = [
    "ollama"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["memcoder*", "memory*", "api*", "adapters*", "agent*", "context*", "llm*"]
exclude = ["tests*", "testing*", "build*", "dist*", "cache*", "client*", "core*", "eval*", "examples*", "extra*", "server*", "session*"]
