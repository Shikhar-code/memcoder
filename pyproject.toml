[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memcoder"
version = "0.2.4b1"
description = "Local, provider-independent cognition for AI agents with verified memory and project continuity."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Shikhar"}
]

license = "MIT"

keywords = [
    "ai",
    "cognition",
    "llm",
    "memory",
    "agent-memory",
    "agent",
    "mcp",
    "planning",
    "quality-assurance",
    "rag",
    "semantic-search",
    "vector-database",
    "chromadb"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "chromadb",
    "sentence-transformers<5",
    "numpy",
    "fastmcp"
]

[project.scripts]
memcoder = "memcoder.cli:main"

[project.urls]
Homepage = "https://github.com/Shikhar-code/memcoder"
Repository = "https://github.com/Shikhar-code/memcoder"
Documentation = "https://github.com/Shikhar-code/memcoder#readme"
Issues = "https://github.com/Shikhar-code/memcoder/issues"
Changelog = "https://github.com/Shikhar-code/memcoder/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["memcoder*", "memory*", "api*", "adapters*"]
exclude = ["tests*", "testing*", "build*", "dist*", "examples*", "scripts*"]
